<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DORS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --purple: #7C3AED;
      --green: #00ff88;
      --bg: #0a0a0a;
      --text: #FFFFFF;
      --grey: #6B7280;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .titlebar {
      height: 36px;
      background: #111;
      display: flex;
      align-items: center;
      padding: 0 16px;
      -webkit-app-region: drag;
      font-size: 13px;
      color: var(--grey);
      border-bottom: 1px solid #222;
    }
    .titlebar span { color: var(--purple); font-weight: 600; margin-right: 8px; }
    .xp-bar {
      padding: 12px 16px;
      background: #111;
      border-bottom: 1px solid #222;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }
    .xp-bar .level { color: var(--green); font-weight: 700; }
    .xp-bar .bar { color: var(--purple); }
    .xp-bar .meta { color: var(--grey); font-size: 11px; margin-top: 4px; }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .chat .message {
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .chat .message.dors { color: var(--green); }
    .chat .message.user { color: var(--text); }
    .chat .label { font-size: 11px; color: var(--grey); margin-bottom: 4px; }
    .input-area {
      padding: 12px 16px;
      background: #111;
      border-top: 1px solid #222;
      display: flex;
      gap: 8px;
    }
    .input-area input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .input-area input:focus { border-color: var(--purple); }
    .input-area button {
      background: var(--purple);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .input-area button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="titlebar">
    <span>DORS</span> desktop v0.1.0
  </div>
  <div class="xp-bar">
    <div><span class="level">[DORS] Level 1</span> <span class="bar">░░░░░░░░░░░░░░░</span> 0/100 XP</div>
    <div class="meta">Next unlock: Read local files (Level 5) | Total XP: 0</div>
  </div>
  <div class="chat" id="chat">
    <div class="message dors">
      <div class="label">DORS</div>
      I'm DORS. Your AI. Your device. Your rules.<br>
      Three Laws active. Type anything to begin.
    </div>
  </div>
  <div class="input-area">
    <input type="text" id="input" placeholder="Talk to DORS..." autofocus>
    <button id="send">Send</button>
  </div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMessage('user', text);
      try {
        const response = await invoke('greet', { name: text });
        addMessage('dors', response);
      } catch (e) {
        addMessage('dors', 'Connection to agent loop pending. Tauri shell sidecar will bridge to @dors/core.');
      }
    }

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = `<div class="label">${role === 'dors' ? 'DORS' : 'You'}</div>${text}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    send.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
